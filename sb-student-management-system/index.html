<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>student management system</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    
        <div class="terminal-container">
            <header class="terminal-header">
                <h1>Portal / Student Database</h1>
                <p>Database Management Panel</p>
            </header>
    
            <main class="glass-console">  
                <form id="database-form" autocomplete="off">
    
                    <!-- 1. Full Name Input Field -->
                    <div class="input-group">
                        <label for="student-name">Full Name</label>
                        <input type="text" id="student-name" placeholder="e.g. Adrienne Vance" required>
                    </div>
    
                    <!-- 2. Email Input Field -->
                    <div class="input-group">
                        <label for="student-email">Email Address</label>
                        <input type="email" id="student-email" placeholder="e.g. adrienne@uni.edu" required>
                    </div>
    
                    <!-- 3. Course Input Field -->
                    <div class="input-group">
                        <label for="student-course">Course / Major</label>
                        <input type="text" id="student-course" placeholder="e.g. Computer Science" required>
                    </div>
                                        <!-- 4. Roll Number Input Field -->
                    <div class="input-group">
                        <label for="student-roll">Roll Number</label>
                        <input type="text" id="student-roll" placeholder="e.g. CS-2026-09" required>
                    </div>
    
                    <!-- Control Execution Cluster -->
                    <div class="action-grid">
                        <button type="submit" id="submit-btn" class="btn btn-submit">Add Student Record</button>
                        <button type="button" id="update-btn" class="btn btn-update">Update</button>
                        <button type="button" id="sync-btn" class="btn btn-sync">Sync Data</button>
                        <button type="button" id="delete-btn" class="btn btn-delete">Delete</button>
                    </div>
                </form>
            </main>
        </div>   

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="./script.js"></script>
</body>
</html>
